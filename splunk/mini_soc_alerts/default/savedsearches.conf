| eval detection="Microsoft Defender detected malware or potentially unwanted software" \
| eval threat_name=coalesce(Threat_Name,ThreatName,Name,"unknown") \
| eval severity=coalesce(Threat_Severity,ThreatSeverity,Severity,"unknown") \
