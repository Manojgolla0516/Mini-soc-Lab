# These rules are installed disabled and with notification actions off.
# Configure recipients and Twilio environment variables before enabling them.

[Mini SOC - Browser Suspicious Launch]
search = index=windows sourcetype="WinEventLog:Security" EventCode=4688 \
| eval process_path=lower(coalesce(New_Process_Name,NewProcessName,Process_Name,ProcessName,process_name,Image,"")) \
| eval command_line=lower(coalesce(Process_Command_Line,ProcessCommandLine,CommandLine,command_line,_raw,"")) \
| lookup browser_alert_rules process_path OUTPUT browser_name suspicious_switches rule_description enabled \
| where enabled=1 AND isnotnull(browser_name) \
| where isnotnull(suspicious_switches) AND match(command_line,suspicious_switches) \
| eval detection="Browser launched with a configured high-risk switch" \
| table _time host browser_name detection rule_description EventCode
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 15m
alert.suppress.fields = host,browser_name,rule_description
action.email = 0
action.email.to = CHANGE_ME@example.com
action.email.subject = Mini SOC alert: Browser suspicious launch
action.twilio_sms = 0

[Mini SOC - Windows Failed Logon Burst]
search = index=windows sourcetype="WinEventLog:Security" EventCode=4625 \
| eval target_user=coalesce(TargetUserName,Account_Name,"unknown") \
| eval source=coalesce(Source_Network_Address,Workstation_Name,"unknown") \
| stats count min(_time) as first_seen max(_time) as last_seen by host target_user source \
| where count>=5 \
| eval detection="Five or more failed Windows logons in five minutes" \
| table host target_user source count first_seen last_seen detection
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 15m
alert.suppress.fields = host,target_user,source
action.email = 0
action.email.to = CHANGE_ME@example.com
action.email.subject = Mini SOC alert: Failed logon burst
action.twilio_sms = 0

[Mini SOC - Windows Security Changes]
search = index=windows sourcetype="WinEventLog:Security" EventCode IN (1102,4719,4720,4728,4732) \
| eval detection=case(EventCode=1102,"Security audit log cleared",EventCode=4719,"System audit policy changed",EventCode=4720,"User account created",EventCode=4728,"Member added to a global security group",EventCode=4732,"Member added to a local security group") \
| eval actor=coalesce(SubjectUserName,Subject_Username,Account_Name,user,"unknown") \
| eval target=coalesce(TargetUserName,MemberName,GroupName,"unknown") \
| table _time host EventCode detection actor target GroupName
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 15m
alert.suppress.fields = host,EventCode
action.email = 0
action.email.to = CHANGE_ME@example.com
action.email.subject = Mini SOC alert: Windows security event
action.twilio_sms = 0

[Mini SOC - Microsoft Defender Detection]
